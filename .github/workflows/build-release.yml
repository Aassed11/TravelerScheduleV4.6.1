name: Build Signed Release APK and AAB

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check release secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAVELER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TRAVELER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRAVELER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TRAVELER_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing secret: TRAVELER_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing secret: TRAVELER_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing secret: TRAVELER_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing secret: TRAVELER_KEY_PASSWORD" && exit 1)

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAVELER_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/traveler-upload.jks"
          test -s "$GITHUB_WORKSPACE/app/traveler-upload.jks"

      - name: Set up Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Show release certificate fingerprints
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.TRAVELER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TRAVELER_KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$GITHUB_WORKSPACE/app/traveler-upload.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | grep -E "SHA1:|SHA256:" || true

      - name: Build signed release APK and AAB
        shell: bash
        env:
          TRAVELER_KEYSTORE_PATH: ${{ github.workspace }}/app/traveler-upload.jks
          TRAVELER_KEYSTORE_PASSWORD: ${{ secrets.TRAVELER_KEYSTORE_PASSWORD }}
          TRAVELER_KEY_ALIAS: ${{ secrets.TRAVELER_KEY_ALIAS }}
          TRAVELER_KEY_PASSWORD: ${{ secrets.TRAVELER_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify release APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Verify release AAB signature
        shell: bash
        run: |
          jarsigner -verify -verbose -certs \
            app/build/outputs/bundle/release/app-release.aab > /tmp/aab-verify.txt
          grep -E "jar verified|verified" /tmp/aab-verify.txt || cat /tmp/aab-verify.txt

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: TravelerSchedule-V4.6.2-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: TravelerSchedule-V4.6.2-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f "$GITHUB_WORKSPACE/app/traveler-upload.jks"
